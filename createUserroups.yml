---
  - name: create users and groups 
    hosts: all
    become: true
   
    vars_files:
      - manage_users/vars/userlists.yml

    tasks:
      - name: create groups 
        ansible.builtin.group:
          name: "{{ item.name }}"
          gid:  "{{ item.gid }}"
          state: present
        loop: "{{ group_list }}"
 
      - name: creating_users
        ansible.builtin.user:
          name: "{{ item.name }}"
          uid:  "{{ item.uid }}"
          append: true
        loop: "{{ name_list }}"


